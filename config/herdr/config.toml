# herdr — terminal workspace manager
# Docs: https://herdr.dev/ja/docs/configuration/

onboarding = false

[theme]
name = "terminal"

[keys]
prefix = "ctrl+a"
workspace_picker = "prefix+s"
settings = "prefix+shift+s"

[[keys.command]]
key = "prefix+l"
type = "pane"
command = "lazygit"
description = "run lazygit"

# デフォルトブランチとの差分を hunk でレビュー
# (呼び出し元ペインの foreground_cwd を起点にするため cd はスクリプト側で行う)
[[keys.command]]
key = "prefix+d"
type = "pane"
command = "sh ~/.config/herdr/hunk-diff.sh"
description = "hunk diff vs default branch"

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true