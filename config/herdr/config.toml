# herdr — terminal workspace manager
# Docs: https://herdr.dev/ja/docs/configuration/

onboarding = false

[theme]
name = "terminal"

[keys]
prefix = "ctrl+a"
workspace_picker = "prefix+s"
settings = "prefix+shift+s"

[[keys.command]]
key = "prefix+l"
type = "pane"
command = "lazygit"
description = "run lazygit"

[[keys.command]]
key = "prefix+d"
type = "shell"
command = "sh ~/.config/herdr/hunk-diff.sh"
description = "hunk diff vs default branch (split right)"

[[keys.command]]
key = "prefix+shift+d"
type = "popup"
width = "80%"
height = "80%"
command = "sh ~/.config/herdr/hunk-diff.sh full"
description = "hunk diff vs default branch (full screen)"

[[keys.command]]
key = "prefix+f"
type = "popup"
width = "80%"
height = "80%"
command = "sh ~/.config/herdr/yazi-popup.sh"
description = "browse files with yazi (popup)"

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true