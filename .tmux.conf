# =========================================================
# tmux.conf — AI-first terminal-centric workflow
# =========================================================
# 凡例:
#   <prefix> = キーバインドの前置キー (このconfigでは C-a に変更済み)
#   "デフォルト:" の表記は素の tmux での挙動
# =========================================================


# ---------- Base ----------

# True Color (24bit) を有効化。これがないと tmux 内で色がくすむ。
# Claude Code / vim / lazygit などの彩色がフルカラーで出るようになる
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# スクロールバック行数。デフォルト 2000 は AI 出力ですぐ枯渇するので 25倍
set -g history-limit 50000

# マウス操作 ON (デフォルト off)。ペイン選択/リサイズ/スクロールが可能に
set -g mouse on

# Esc キーが Meta シーケンスの一部か判定する待ち時間 (デフォルト 500ms)。
# vim/nvim で Esc の反応が遅くなるので 10ms に短縮
set -sg escape-time 10

# ターミナル → tmux → 中のアプリへフォーカスイベントを伝搬。
# nvim の autoread などが効くようになる (副作用なし)
set -g focus-events on

# ウィンドウ/ペイン番号を 1 始まりに (デフォルトは 0 始まり)。
# キーボード上で 0 は右端で押しにくいため
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウを閉じた時に番号を自動で詰める (1,3,5 → 1,2,3)
set -g renumber-windows on

# OS クリップボードへの中継を有効化 (OSC52)。iTerm2 と連携
set -g set-clipboard on

# 中のアプリ (Claude Code 等) が送る OSC エスケープシーケンスを外側端末まで素通しさせる。
# tmux 3.3 でデフォルト off に変更されたため明示的に on が必要。
# これがないと iTerm2 の OSC 9 通知 (Claude Code の preferredNotifChannel=iterm2_with_bell) が
# tmux に飲み込まれ、デスクトップ通知が出なくなる
set -g allow-passthrough on

# セッションを kill しても tmux サーバーを終了させない (デフォルト on)。
# off にすると最後のセッションを閉じても tmux 自体は生き続け、別セッションに自動 detach される。
# sesh + continuum で「セッションを使い捨て、サーバーは常駐」運用に必須
set -g detach-on-destroy off


# ---------- Prefix: C-b -> C-a ----------

# デフォルトの C-b は Emacs の「1文字戻る」と衝突 & 押しにくい。
# screen 由来の C-a に変更 (A キーの隣で押しやすい)。
# 素の C-a を送りたい時は C-a を 2 回連打 (= send-prefix で素通し)
unbind C-b
set -g prefix C-a
bind C-a send-prefix


# ---------- Reload ----------

# <prefix> r で設定ファイルを再読込 (tmux を立ち上げ直さなくていい)
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"


# ---------- Splits: 記号と見た目を一致させる ----------

# デフォルトの " (横分割) / % (縦分割) は覚えにくいので、
# | で縦線割り (左右に並ぶ), - で横線割り (上下に並ぶ) に変更。
# -c "#{pane_current_path}" で新ペインが現在の cwd を引き継ぐ。
# これがないと毎回 cd し直すハメになる
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# 新規ウィンドウも cwd を引き継ぐように上書き (デフォルトは session 開始時の cwd)
bind c new-window -c "#{pane_current_path}"


# ---------- Vim-style pane navigation ----------

# 矢印キーへ手を伸ばさず hjkl で移動。
# 将来 vim-tmux-navigator を入れると tmux ペインと nvim ウィンドウを
# 同じ C-h/j/k/l で横断できるようになる伏線
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ---------- display-panes ----------

# <prefix> q で各ペインに大きな番号が表示され、続けて数字キーを押すと一発でそのペインへ。
# デフォルトの表示時間 1000ms (1秒) は押しそびれやすいので 2000ms に延長。
# 3 ペイン以上のレイアウトで prefix+hjkl を連打するより速い
set -g display-panes-time 2000


# ---------- Resize ----------

# Shift+hjkl で 5 セルずつリサイズ。
# -r オプションで連打可 (一度 <prefix> を押せば、その後はプレフィックスなしで
# H H H と連打して動かせる = repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# ---------- Copy mode (vi) + macOS pbcopy ----------

# デフォルトは Emacs キーバインド。vim と揃えて vi モードに変更。
# v で選択開始 / y でヤンクと同時に macOS の pbcopy へ流す
# → 他アプリで Cmd+V でペーストできる
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# マウスドラッグ離した時にも自動で pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"


# ---------- AI-first: Claude Code を即起動 (独自バインド) ----------

# <prefix> a : 右に 50% 幅で claude を起動 (メイン作業ペイン構成)
bind a split-window -h -l 50% -c "#{pane_current_path}" "claude"
# <prefix> A : 下に 30% 高さで claude を起動 (縦長レイアウト用)
bind A split-window -v -l 30% -c "#{pane_current_path}" "claude"


# ---------- Quick layout ----------

# <prefix> M で main-vertical レイアウト (左に大きい pane / 右に複数の縦並び)。
# editor + AI + logs 構成と相性が良い。
# デフォルト呼び出しキー <prefix> M-2 (Meta+2) は mac で押しにくいので単独 M に
bind M select-layout main-vertical


# ---------- Session switcher (sesh) ----------

# <prefix> f で sesh のセッションピッカーを fzf-tmux ポップアップで開く。
# sesh は「tmux セッションへの入口」を統一するツールで、
# 手動定義セッション (~/.config/sesh/sesh.toml) + zoxide のディレクトリ +
# 既存 tmux セッションを横断検索できる。
#
# キーバインド (ピッカー内):
#   ^a : 全候補   ^t : 既存tmuxのみ   ^g : configのみ   ^x : zoxideのみ
#   ^f : fd でホーム配下を探索   ^d : ハイライト中の tmux セッションを kill
bind-key "f" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '^a all ^t tmux ^g configs ^x zoxide ^f find ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 3 -t d -E .Trash -E node_modules -E .git . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# <prefix> S で tmux 標準のセッション一覧 (sesh の代替/補助)
bind S choose-tree -Zs

# <prefix> X で現在のセッションを kill (確認なし)
bind X confirm-before -p "kill session #S? (y/n)" kill-session


# ---------- lazygit popup ----------

# <prefix> g でフォーカス中ペインの cwd を起点に lazygit をポップアップで開く。
#   -E              : lazygit 終了時にポップアップを自動で閉じる
#   -w 90% -h 90%   : 画面の 90% サイズで中央表示
#   -d              : 起動ディレクトリ = 現在ペインの cwd
# lazygit は q で抜けるとそのままポップアップが閉じる。
# tmux のレイアウトを崩さずに「差分確認 → コミット → 戻る」が一発でできる
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"


# ---------- Fuzzy file finder (popup) ----------

# <prefix> T で popup を開き、fd で取得したファイル一覧を fzf で絞り込む。
# プレビュー = bat (先頭 500 行)。Enter でその場で vim で開く。
#   --type f --hidden --exclude .git : 通常ファイルのみ。隠しファイルは含むが .git は除外
#   xargs -r        : fzf が選択せずに抜けた時 (Esc) に vim を空起動しない
bind T display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
  "fd --type f --hidden --exclude .git | fzf --preview 'bat --color=always --style=numbers --line-range=:500 {}' | xargs -r vim"


# ---------- Full-text search (popup) ----------

# <prefix> F でリポジトリ全体を ripgrep で grep。fzf で結果を絞り込み、
# bat プレビューはマッチ行を中央にハイライト表示。Enter でその行に vim でジャンプ。
#
# 注意:
#   - rg はシェル関数として Claude Code 側に上書きされている事があるので、
#     popup 内では `command rg` で素の /opt/homebrew/bin/rg を呼ぶ
#   - 空クエリ '' で全行を fzf に流す方式 (kazue-san と同じ)。
#     超巨大リポジトリでは負荷が高いので、その時は方式を見直す
#   - --smart-case  : クエリが小文字のみなら大文字小文字を無視
#   - awk '+lineno' : vim に "+行番号" + ファイル名を渡して該当行へジャンプ
bind F display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
  "command rg --color=always --line-number --no-heading --smart-case '' | fzf --ansi --delimiter=: --preview 'bat --color=always --style=numbers --highlight-line {2} {1}' --preview-window '+{2}-5' | awk -F: '{print \"+\" $2, $1}' | xargs -r vim"


# ---------- Terminal title (iTerm2 タブ名連動) ----------

# tmux からホスト端末 (iTerm2) へタイトルを送出する。
# デフォルト off。on にすると OSC エスケープシーケンス (\033]2;...\033\\)
# が emit され、iTerm2 側の「Allow Title Setting」が ON なのでタブ名に反映される。
set -g set-titles on

# タブ名に出すフォーマット = 現在アクティブな tmux ウィンドウ名 (#W)。
# tmux 側でウィンドウを切り替えると iTerm2 タブ名もリアルタイムに追従する。
# 他に使える主な変数:
#   #S = セッション名 / #I = ウィンドウ番号 / #{pane_current_command} = 実行中コマンド
set -g set-titles-string '[#S] #W'


# ---------- Status bar ----------

# ステータスバーを上に配置 (デフォルトは下)。
# vim/nvim のステータスや shell プロンプトと位置がぶつからない
set -g status-position top
# 再描画間隔 (デフォルト 15s だと時計の更新が遅い)
set -g status-interval 5
set -g status-style "bg=default,fg=white"
# 左端にセッション名
set -g status-left  "#[fg=green,bold] #S #[fg=white]│ "
# 右端: #{?client_prefix,● ,} は <prefix> 押下中だけ ● を表示するインジケータ。
# 「今プレフィックス入力中か」が一目で分かるので tmux 初心者の混乱対策
set -g status-right "#[fg=cyan]#{?client_prefix,● ,}#[fg=yellow]%Y-%m-%d %H:%M "
set -g status-left-length 40
setw -g window-status-current-style "fg=black,bg=cyan,bold"
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format " #I:#W "


# =========================================================
# Plugins (TPM = tmux plugin manager)
# ---------------------------------------------------------
#   初回プラグイン取得: <prefix> I  (大文字 I)
#   プラグイン更新:     <prefix> U
#   プラグイン削除:     <prefix> alt+u
# =========================================================

set -g @plugin 'tmux-plugins/tpm'

# tmux-sensible: コミュニティ推奨の無難な設定パック (冪等)
set -g @plugin 'tmux-plugins/tmux-sensible'

# tmux-yank: コピー周りを強化。
# SSH 越しでも OSC52 でローカルのクリップボードに飛ばせる
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-resurrect: セッション/ウィンドウ/ペイン構成を保存・復元。
#   <prefix> C-s で保存 / <prefix> C-r で復元
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-continuum: resurrect を定期的に自動セーブ (再起動/クラッシュ対策)
set -g @plugin 'tmux-plugins/tmux-continuum'

# ペインの出力内容まで保存 (Claude Code のログが消えにくくなる)
set -g @resurrect-capture-pane-contents 'on'

# 自動保存の間隔 (分)。デフォルト 15
set -g @continuum-save-interval '5'

# tmux サーバー起動時に直近の保存状態を自動復元 (PC 再起動後の復帰用)
set -g @continuum-restore 'on'

# TPM 本体の読み込み (この行は必ず一番下に)
run '~/.tmux/plugins/tpm/tpm'
